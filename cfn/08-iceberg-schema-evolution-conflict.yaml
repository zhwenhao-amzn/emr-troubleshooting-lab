AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EMR Troubleshooting Lab - Scenario 08: Iceberg Schema Evolution Conflict
  Creates Iceberg table then writes data with mismatched schema.

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  LogBucket:
    Type: String

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-data-${AWS::AccountId}'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseInput:
        Name: emr_lab_08_schema_db

  EMREC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-emr-ec2'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonElasticMapReduceforEC2Role'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: GlueAndS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:*
                  - s3:*
                Resource: '*'

  EMREC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-emr-ec2'
      Roles:
        - !Ref EMREC2Role

  EMRCluster:
    Type: AWS::EMR::Cluster
    DependsOn:
      - GlueDatabase
      - DataBucket
    Properties:
      Name: !Sub '${AWS::StackName}-schema-conflict'
      ReleaseLabel: emr-7.1.0
      Applications:
        - Name: Spark
        - Name: Hadoop
      ServiceRole: EMR_DefaultRole
      JobFlowRole: !Ref EMREC2InstanceProfile
      LogUri: !Sub 's3://${LogBucket}/emr-logs/'
      VisibleToAllUsers: true
      Instances:
        MasterInstanceGroup:
          InstanceCount: 1
          InstanceType: m5.xlarge
          Market: ON_DEMAND
          Name: Primary
        CoreInstanceGroup:
          InstanceCount: 1
          InstanceType: m5.xlarge
          Market: ON_DEMAND
          Name: Core
        Ec2SubnetId: !Ref SubnetId
      Configurations:
        - Classification: spark-defaults
          ConfigurationProperties:
            spark.sql.catalog.glue_catalog: org.apache.iceberg.spark.SparkCatalog
            spark.sql.catalog.glue_catalog.warehouse: !Sub 's3://${DataBucket}/warehouse/'
            spark.sql.catalog.glue_catalog.catalog-impl: org.apache.iceberg.aws.glue.GlueCatalog
            spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            spark.jars.packages: org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,software.amazon.awssdk:bundle:2.25.11
      Steps:
        - Name: UploadScripts
          ActionOnFailure: CONTINUE
          HadoopJarStep:
            Jar: command-runner.jar
            Args:
              - bash
              - -c
              - !Sub |
                cat > /tmp/schema_setup.py << 'PYEOF'
                from pyspark.sql import SparkSession
                import pyspark.sql.functions as F

                spark = SparkSession.builder.appName("Schema-Setup").getOrCreate()

                spark.sql("""
                    CREATE TABLE IF NOT EXISTS glue_catalog.emr_lab_08_schema_db.orders (
                        order_id BIGINT,
                        customer_name STRING,
                        amount DOUBLE,
                        order_date TIMESTAMP
                    ) USING iceberg
                    TBLPROPERTIES ('format-version'='2')
                """)

                df = spark.range(0, 100).select(
                    F.col("id").alias("order_id"),
                    F.concat(F.lit("customer_"), F.col("id").cast("string")).alias("customer_name"),
                    (F.col("id") * 9.99).alias("amount"),
                    F.current_timestamp().alias("order_date")
                )
                df.writeTo("glue_catalog.emr_lab_08_schema_db.orders").append()
                print("Initial write succeeded: 100 rows")
                spark.stop()
                PYEOF

                cat > /tmp/schema_mismatch.py << 'PYEOF2'
                from pyspark.sql import SparkSession
                import pyspark.sql.functions as F

                spark = SparkSession.builder.appName("Schema-Mismatch-Write").getOrCreate()

                # "New version" of the app adds extra columns
                # Simulates a deployment that changed the data pipeline schema
                df = spark.range(0, 50).select(
                    F.col("id").alias("order_id"),
                    F.concat(F.lit("customer_"), F.col("id").cast("string")).alias("customer_name"),
                    (F.col("id") * 9.99).alias("amount"),
                    F.current_timestamp().alias("order_date"),
                    F.lit("electronics").alias("category"),
                    F.lit("pending").alias("status"),
                    F.col("id").cast("int").alias("priority")
                )
                print(f"DataFrame schema: {df.schema.simpleString()}")
                print("Attempting to write with mismatched schema...")
                df.writeTo("glue_catalog.emr_lab_08_schema_db.orders").append()
                print("Write succeeded (should not reach here)")
                spark.stop()
                PYEOF2

                aws s3 cp /tmp/schema_setup.py s3://${LogBucket}/emr-scripts/schema_setup.py
                aws s3 cp /tmp/schema_mismatch.py s3://${LogBucket}/emr-scripts/schema_mismatch.py
        - Name: CreateTableAndSeedData
          ActionOnFailure: CONTINUE
          HadoopJarStep:
            Jar: command-runner.jar
            Args:
              - spark-submit
              - --master
              - yarn
              - --deploy-mode
              - cluster
              - --conf
              - spark.driver.memory=2g
              - !Sub 's3://${LogBucket}/emr-scripts/schema_setup.py'
        - Name: SchemaMismatchWrite
          ActionOnFailure: CONTINUE
          HadoopJarStep:
            Jar: command-runner.jar
            Args:
              - spark-submit
              - --master
              - yarn
              - --deploy-mode
              - cluster
              - --conf
              - spark.driver.memory=2g
              - !Sub 's3://${LogBucket}/emr-scripts/schema_mismatch.py'

Outputs:
  ClusterId:
    Description: EMR Cluster ID
    Value: !Ref EMRCluster
  TestPrompt:
    Description: Prompt to test DevOps Agent
    Value: !Sub >
      Spark job writing to Iceberg table failed with schema error on EMR cluster
      ${EMRCluster}. The job was working fine yesterday but after a deployment
      it started failing. The table is in Glue database emr_lab_08_schema_db.
      Help me troubleshoot.
